[project]
name = "filemino-backend"
version = "0.1.0"
description = "Backend API for FileMino file-processing tools."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "boto3>=1.35,<2.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "Pillow>=11.3,<13.0",
  "python-multipart>=0.0.9,<1.0",
  "redis>=5.0,<7.0",
  "rq>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
  "ruff>=0.12,<1.0",
]

[project.scripts]
filemino-diagnose = "app.utils.diagnostic:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: tests that run locally installed FFmpeg and ffprobe",
  "e2e: tests that require FFmpeg, ffprobe, Redis, and an RQ worker",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
